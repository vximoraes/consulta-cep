<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <title>Consulta CEP</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <button type="button" id="theme-toggle" aria-label="Alternar tema">
      <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <form action="">
      <h1>Consulta CEP</h1>
      <div>
        <label for="cep">CEP</label>
        <input type="text" id="cep" placeholder="Ex.: 76980-000">
      </div>
      <div>
        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" placeholder="Ex.: Rua das Flores">
      </div>
      <div>
        <label for="numero">Número</label>
        <input type="text" id="numero" placeholder="Ex.: 123">
      </div>
      <div>
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" placeholder="Ex.: Centro">
      </div>
      <div>
        <label for="estado">Estado</label>
        <select name="estados" id="estados">
          <option value="Selecione...">Selecione...</option>
        </select>
      </div>
      <div>
        <label for="cidade">Cidade</label>
        <select name="cidades" id="cidades">
          <option value="Selecione...">Selecione...</option>
        </select>
      </div>
      <div style="margin-top:12px;">
        <button type="button" id="copiar">Copiar</button>
      </div>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
